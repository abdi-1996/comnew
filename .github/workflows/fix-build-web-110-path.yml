name: Fix Web 1.1.0 stable smoke path

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-build-web-110-path.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix stable server path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-web-110.yml')
          s = p.read_text(encoding='utf-8')
          old = "$stableDir=Join-Path $env:LOCALAPPDATA 'PCRemoteServer-Web-110-CI'"
          new = "$stableDir=Join-Path $env:LOCALAPPDATA 'PCRemoteServer'"
          if old not in s and new not in s:
              raise SystemExit('stable path anchor not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Comfy Remote Builder"
          git config user.email "actions@github.com"
          git add .github/workflows/build-web-110.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Web 1.1.0 smoke test stable path"
          git push
