name: Materialize Comfy Remote 2.1.3 Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-source.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct patched 2.1.3 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/ComfyRemote_1.1.4_Tailscale_PreLogin_Fix.zip"
          test -f "$ZIP_PATH"
          rm -rf "$RUNNER_TEMP/comfy-source"
          mkdir -p "$RUNNER_TEMP/comfy-source"
          unzip -q -o "$ZIP_PATH" -d "$RUNNER_TEMP/comfy-source"

          PROJECT_PATH="$(find "$RUNNER_TEMP/comfy-source" -type d -name 'PCRemote.xcodeproj' -print -quit)"
          test -n "$PROJECT_PATH"
          SOURCE_ROOT="$(dirname "$(dirname "$(dirname "$PROJECT_PATH")")")"

          export GITHUB_WORKSPACE RUNNER_TEMP
          python3 - <<'PY'
          import base64, lzma, os
          from pathlib import Path
          ws = Path(os.environ['GITHUB_WORKSPACE'])
          parts = sorted((ws / 'source_patch').glob('part*.txt'))
          if len(parts) != 9:
              raise SystemExit(f'Expected 9 patch parts, found {len(parts)}')
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          out = Path(os.environ['RUNNER_TEMP']) / 'build213.patch'
          out.write_bytes(patch)
          print(f'Reconstructed patch: {len(patch)} bytes')
          PY

          cd "$SOURCE_ROOT"
          git apply --check --unsafe-paths -p1 "$RUNNER_TEMP/build213.patch"
          git apply --unsafe-paths -p1 "$RUNNER_TEMP/build213.patch"
          test -f "$SOURCE_ROOT/ios/PCRemote/PCRemote/MainView.swift"
          test -f "$SOURCE_ROOT/windows/server.py"
          grep -q '6.2.2' "$SOURCE_ROOT/windows/server.py"
          echo "root=$SOURCE_ROOT" >> "$GITHUB_OUTPUT"

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/current_source"
          mkdir -p "$GITHUB_WORKSPACE/current_source"
          rsync -a --exclude '.git' "${{ steps.source.outputs.root }}/" "$GITHUB_WORKSPACE/current_source/"

          cd "$GITHUB_WORKSPACE"
          git config user.name "Comfy Remote Builder"
          git config user.email "actions@users.noreply.github.com"
          git add current_source
          if git diff --cached --quiet; then
            echo "current_source already matches 2.1.3"
            exit 0
          fi
          git commit -m "Materialize Comfy Remote 2.1.3 source"
          git push origin HEAD:main
