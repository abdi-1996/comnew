name: Build Comfy Remote Web 1.0.0 + Server 6.4.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-web-100.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Build PCRemoteServer 6.4.0 Web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify source
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:GITHUB_WORKSPACE 'current_source\windows'
          $web=Join-Path $dir 'web'
          python -m py_compile (Join-Path $dir 'server.py') (Join-Path $dir 'gui.py') (Join-Path $dir 'corel_bridge.py')
          node --check (Join-Path $web 'app.js')
          node --check (Join-Path $web 'sw.js')
          if (-not (Select-String -Path (Join-Path $dir 'server.py') -Pattern 'PCREMOTE_VERSION = "6.4.0"' -Quiet)) { throw '6.4.0 marker missing' }
          if (-not (Select-String -Path (Join-Path $dir 'server.py') -Pattern 'def comfy_web_index' -Quiet)) { throw 'web route missing' }
          if (-not (Select-String -Path (Join-Path $web 'app.js') -Pattern '/api/comfy/prompt/set' -Quiet)) { throw 'prompt sync missing' }
          "dir=$dir" >> $env:GITHUB_OUTPUT
          "web=$web" >> $env:GITHUB_OUTPUT
          "gui=$(Join-Path $dir 'gui.py')" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          $req="${{ steps.source.outputs.dir }}\requirements.txt"
          if (Test-Path $req) { python -m pip install -r $req }

      - name: Build server EXE with web assets
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --paths "${{ steps.source.outputs.dir }}" `
            --add-data "${{ steps.source.outputs.web }};web" `
            --collect-all mss --collect-all pyautogui --collect-all comtypes `
            --hidden-import comtypes.client --hidden-import corel_bridge `
            --hidden-import pyperclip --hidden-import psutil --hidden-import websocket --hidden-import winreg `
            --name PCRemoteServer "${{ steps.source.outputs.gui }}"

      - name: Smoke test Web server
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Get-Process PCRemoteServer -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $sourceExe=Resolve-Path 'dist\PCRemoteServer.exe'
          $stableDir=Join-Path $env:LOCALAPPDATA 'PCRemoteServer'
          New-Item -ItemType Directory -Force -Path $stableDir | Out-Null
          $stableExe=Join-Path $stableDir 'PCRemoteServer.exe'
          Copy-Item $sourceExe $stableExe -Force
          $proc=Start-Process -FilePath $stableExe -WorkingDirectory $stableDir -PassThru
          try {
            $ready=$false
            for ($i=0; $i -lt 45; $i++) {
              Start-Sleep -Milliseconds 700
              try {
                $ping=Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/ping' -TimeoutSec 2
                if ($ping.ok -eq $true -and $ping.server_version -eq '6.4.0') { $ready=$true; break }
              } catch {}
              if ($proc.HasExited) { throw "Server exited: $($proc.ExitCode)" }
            }
            if (-not $ready) { throw 'Server 6.4.0 did not start' }

            $html=Invoke-WebRequest -Uri 'http://127.0.0.1:8765/web/' -UseBasicParsing -TimeoutSec 5
            if ($html.StatusCode -ne 200 -or $html.Content -notmatch 'Comfy Remote Web') { throw 'Web index smoke test failed' }
            $js=Invoke-WebRequest -Uri 'http://127.0.0.1:8765/web/app.js' -UseBasicParsing -TimeoutSec 5
            if ($js.StatusCode -ne 200 -or $js.Content -notmatch '/api/comfy/generate') { throw 'Web JS smoke test failed' }
            $manifest=Invoke-WebRequest -Uri 'http://127.0.0.1:8765/web/manifest.webmanifest' -UseBasicParsing -TimeoutSec 5
            if ($manifest.StatusCode -ne 200 -or $manifest.Content -notmatch 'Comfy Remote Web') { throw 'Manifest smoke test failed' }

            $config=Get-Content (Join-Path $stableDir 'config.json') -Raw | ConvertFrom-Json
            $headers=@{ Authorization = "Bearer $($config.token)" }
            $info=Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/web/info' -Headers $headers -TimeoutSec 5
            if ($info.ok -ne $true -or $info.web_version -ne '1.0.0') { throw 'Protected web API smoke test failed' }
            $dash=Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/comfy/dashboard' -Headers $headers -TimeoutSec 8
            if ($dash.ok -ne $true) { throw 'Comfy dashboard route failed' }
            Write-Host "Comfy Remote Web 1.0.0 smoke test OK"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-Process PCRemoteServer -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Package Windows server
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'ComfyRemote-Web-Server' | Out-Null
          Copy-Item 'dist\PCRemoteServer.exe' 'ComfyRemote-Web-Server\PCRemoteServer.exe'
          foreach ($name in @('SETUP_NETWORK_ADMIN.ps1','SETUP_NETWORK_ADMIN.bat','CHECK_NETWORK.ps1','INSTALL_STABLE_SERVER.ps1','INSTALL_STABLE_SERVER.bat','OPEN_COMFY_REMOTE_WEB.bat')) {
            $src=Join-Path "${{ steps.source.outputs.dir }}" $name
            if (Test-Path $src) { Copy-Item $src (Join-Path 'ComfyRemote-Web-Server' $name) }
          }
          Copy-Item "${{ steps.source.outputs.web }}" 'ComfyRemote-Web-Server\web-source' -Recurse
          @"
          Comfy Remote Web 1.0.0
          PCRemoteServer 6.4.0

          1. Запустите PCRemoteServer.exe.
          2. На этом ПК откройте OPEN_COMFY_REMOTE_WEB.bat.
          3. С телефона откройте http://IP_ПК:8765/web/ или http://TAILSCALE_IP:8765/web/.
          4. Войдите паролем PC Remote Server или через PCR1 Connection ID.
          "@ | Set-Content 'ComfyRemote-Web-Server\README-WEB.txt' -Encoding UTF8

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PCRemoteServer-6.4.0-ComfyRemote-Web-1.0.0
          path: ComfyRemote-Web-Server
          if-no-files-found: error

      - name: Upload standalone web source
        uses: actions/upload-artifact@v4
        with:
          name: ComfyRemote-Web-1.0.0-Source
          path: current_source/windows/web
          if-no-files-found: error
